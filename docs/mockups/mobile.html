<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body { margin: 0 } [hidden] { display: none !important }</style>
<title>埃隆迪亞手機版樣稿</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=LXGW+WenKai+TC&display=swap">
<style>
/* 版面：手機直式單欄。上：狀態列（只看）→ 地圖（探索時大、閱讀時縮成一條）→ 日誌 → 情境按鈕 → 底部分頁列（要按的都在下面）
   寬螢幕時旁邊多一欄「樣稿說明」。配色沿用遊戲 src/style.css 的皮革與金色，只做深色一套。 */
:root {
  --bg: #120d09;
  --panel: #221a13;
  --panel-2: #2d231a;
  --border: #4a3a28;
  --text: #efe4cc;
  --muted: #9a8768;
  --accent: #d9a54a;
  --gold-hi: #f0d083;
  --gold-lo: #6d5128;
  --danger: #d8604e;
  --good: #7cba6a;
  --hp: #c8483a;
  --mp: #4a83c9;
  --parch: #ecdcb6;
  --parch-2: #dfc896;
  --ink: #33231a;
  --ink-2: #6b5038;
  --tile-street: #4a3c2c;
  --tile-house: #15100b;
  --tile-grass: #2c3a20;
  --tile-tree: #1d2a16;
  --tile-stone: #2a2622;
  --scrim: #000000a6;
  --font-body: 'Noto Serif TC', 'Noto Serif CJK TC', 'PMingLiU', serif;
  --font-story: 'LXGW WenKai TC', 'Noto Serif TC', serif;
  --fs-xs: 0.72rem; --fs-sm: 0.84rem; --fs-md: 0.95rem; --fs-lg: 1.1rem; --fs-xl: 1.5rem;
  --radius: 4px;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 15px;
  display: flex; justify-content: center; gap: 32px; overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
button:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
.ico { width: 22px; height: 22px; flex: none; }
.ico.sm { width: 16px; height: 16px; }

/* ── 手機本體 */
.app {
  position: relative; width: 100%; max-width: 440px; height: 100%;
  display: flex; flex-direction: column; background: var(--bg); overflow: hidden;
  border-left: 1px solid var(--border); border-right: 1px solid var(--border);
}
.band { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* 狀態列：只看不按（鈴鐺例外） */
.status {
  flex: none; display: flex; align-items: center; gap: 10px; padding-block: 8px;
  background: linear-gradient(180deg, #2a2017, #1d1611); border-bottom: 1px solid var(--gold-lo);
  font-size: var(--fs-sm); font-variant-numeric: tabular-nums; white-space: nowrap;
}
.status .cell { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); min-width: 0; }
.status .cell b { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.status .money b { color: var(--gold-hi); }
.status .bell { margin-left: auto; position: relative; display: grid; place-items: center; width: 40px; height: 36px; color: var(--gold-hi); }
.badge {
  position: absolute; top: 0; right: 2px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px;
  background: var(--danger); color: #fff; font: 700 11px/17px system-ui, sans-serif; text-align: center;
}
.badge.gold { background: var(--accent); color: var(--ink); }
.badge.dot { min-width: 9px; width: 9px; height: 9px; padding: 0; top: 6px; right: calc(50% - 18px); }

/* 地圖 */
.mapwrap { flex: none; border-bottom: 1px solid var(--border); background: var(--panel); }
.maphead { display: flex; align-items: center; gap: 8px; padding-block: 8px; width: 100%; text-align: left; }
.maphead .name { font-weight: 900; color: var(--gold-hi); letter-spacing: 0.06em; }
.maphead .sub { color: var(--muted); font-size: var(--fs-xs); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.maphead .toggle { display: inline-flex; align-items: center; gap: 2px; color: var(--accent); font-size: var(--fs-sm); }
.maphead .toggle .ico { transition: transform 0.2s; }
.app.reading .maphead .toggle .ico { transform: rotate(180deg); }
.grid {
  display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; padding-bottom: 10px;
  transition: opacity 0.2s;
}
.app.reading .grid { display: none; }
.tile {
  position: relative; aspect-ratio: 1; max-width: 100%; border-radius: 2px; display: grid; place-items: center;
  font-size: var(--fs-xs); font-weight: 600; color: var(--text); line-height: 1.05; text-align: center;
  box-shadow: inset 0 0 0 1px #00000055;
}
.tile.street { background: var(--tile-street); }
.tile.house { background: var(--tile-house); cursor: default; }
.tile.grass { background: var(--tile-grass); }
.tile.tree { background: var(--tile-tree); cursor: default; }
.tile.stone { background: var(--tile-stone); }
.tile.bld { background: #4b3420; box-shadow: inset 0 0 0 1px var(--gold-lo); color: var(--gold-hi); }
.tile.exit { background: #1f2d2a; box-shadow: inset 0 0 0 1px #7fb5a2; color: #a9d8c6; }
.tile.near::after { content: ''; position: absolute; inset: 3px; border: 1px dashed #f0d08066; border-radius: 2px; pointer-events: none; }
.tile.target { box-shadow: inset 0 0 0 2px var(--gold-hi); }
.tile .who { position: absolute; right: 2px; top: 1px; font-size: 10px; color: #8fd0ff; }
.hero {
  position: absolute; inset: 18%; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff1c6, #e2b45a 55%, #a87528);
  box-shadow: 0 0 0 2px #120d09, 0 0 10px #f0d083aa; transition: transform 0.12s;
}

/* 日誌 */
.log { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-block: 10px 14px; display: flex; flex-direction: column; gap: 8px; scroll-behavior: smooth; }
.entry { font-size: var(--fs-sm); color: var(--muted); display: flex; gap: 8px; line-height: 1.55; }
.entry time { flex: none; font-variant-numeric: tabular-nums; color: var(--gold-lo); }
.entry.sys b { color: var(--text); font-weight: 600; }
.entry.story {
  display: block; background: linear-gradient(180deg, var(--parch), var(--parch-2)); color: var(--ink);
  font-family: var(--font-story); font-size: 1rem; line-height: 1.85; padding: 12px 14px; border-radius: var(--radius);
  box-shadow: inset 0 0 0 1px #b8955a, 0 4px 12px #0007;
}
.entry.story .who { display: block; font-family: var(--font-body); font-size: var(--fs-xs); color: var(--ink-2); margin-bottom: 4px; }
.entry.new { animation: slide-in 0.3s ease-out; }
@keyframes slide-in { from { opacity: 0; transform: translateY(6px); } }

/* 情境按鈕：站在設施上才出現 */
.ctx { flex: none; padding-block: 8px; border-top: 1px solid var(--border); background: var(--panel); }
.ctx button {
  width: 100%; min-height: 46px; display: flex; align-items: center; justify-content: center; gap: 8px;
  background: linear-gradient(180deg, #e5b75a, #b2822f); color: #22160b; font-weight: 900; letter-spacing: 0.08em;
  border-radius: var(--radius); box-shadow: inset 0 0 0 1px #f0d083, 0 3px 10px #0008;
}

/* 底部分頁列 */
.tabbar { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); background: linear-gradient(180deg, #2a2017, #17110c); border-top: 1px solid var(--gold-lo); }
.tabbar button {
  position: relative; min-height: 58px; display: grid; justify-items: center; align-content: center; gap: 3px;
  color: var(--muted); font-size: var(--fs-xs);
}
.tabbar button .ico { color: var(--accent); }
.tabbar button.on { color: var(--gold-hi); }
.tabbar button.on::before { content: ''; position: absolute; top: 0; left: 22%; right: 22%; height: 2px; background: var(--accent); }

/* 半屏面板 */
.scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 20; animation: fade 0.2s; }
@keyframes fade { from { opacity: 0; } }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 72%; display: flex; flex-direction: column;
  background: linear-gradient(180deg, #2a2017, #1d1611); border-top: 1px solid var(--accent); border-radius: 12px 12px 0 0;
  box-shadow: 0 -10px 30px #000b; animation: up 0.22s ease-out; transition: max-height 0.22s;
}
.sheet.full { max-height: 94%; }
@keyframes up { from { transform: translateY(40%); opacity: 0.4; } }
.sheet .grip { flex: none; display: grid; place-items: center; height: 22px; width: 100%; }
.sheet .grip::before { content: ''; width: 44px; height: 4px; border-radius: 2px; background: var(--gold-lo); }
.sheet header { flex: none; display: flex; align-items: center; gap: 8px; padding-block: 0 10px; }
.sheet header h2 { margin: 0; font-size: var(--fs-lg); font-weight: 900; color: var(--gold-hi); letter-spacing: 0.08em; flex: 1; text-wrap: balance; }
.sheet header .x { width: 36px; height: 36px; display: grid; place-items: center; color: var(--muted); }
.sheet .body { overflow-y: auto; overscroll-behavior: contain; padding-block: 0 18px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.seg { display: flex; border-bottom: 1px solid var(--border); }
.seg button { flex: 1; padding: 8px; color: var(--muted); border-bottom: 2px solid transparent; }
.seg button.on { color: var(--gold-hi); border-bottom-color: var(--accent); }
.section-title { font-size: var(--fs-xs); color: var(--muted); letter-spacing: 0.12em; margin: 4px 0 -4px; }
.list { display: flex; flex-direction: column; gap: 6px; }
.row {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #0000004d; border: 1px solid #ffffff14; border-radius: var(--radius);
}
.row .main { flex: 1; min-width: 0; }
.row .main b { display: block; font-weight: 600; }
.row .main small { color: var(--muted); font-size: var(--fs-xs); }
.btn {
  min-height: 40px; padding: 0 14px; border-radius: var(--radius); background: linear-gradient(180deg, #3b2c1e, #2a1f15);
  border: 1px solid var(--gold-lo); color: var(--text); font-size: var(--fs-sm); white-space: nowrap;
}
.btn.primary { background: linear-gradient(180deg, #e5b75a, #b2822f); border-color: var(--gold-hi); color: #22160b; font-weight: 700; }
.btn.wide { width: 100%; min-height: 48px; }
.avatar {
  flex: none; width: 40px; height: 40px; border-radius: 3px; display: grid; place-items: center; font-weight: 900;
  background: #4b3420; color: var(--gold-hi); box-shadow: inset 0 0 0 1px var(--gold-lo);
}
.bar { height: 6px; border-radius: 3px; background: #5a1c16; overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; background: var(--hp); }
.chip { font-size: var(--fs-xs); padding: 1px 6px; border-radius: 2px; background: var(--accent); color: var(--ink); font-weight: 700; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.more-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.more-grid button {
  position: relative; min-height: 72px; display: grid; justify-items: center; align-content: center; gap: 6px;
  background: #0000004d; border: 1px solid #ffffff14; border-radius: var(--radius); font-size: var(--fs-xs); color: var(--text);
}
.more-grid button .ico { color: var(--accent); }
.more-grid .badge { top: 4px; right: 6px; }
.empty { color: var(--muted); font-size: var(--fs-sm); padding: 10px 12px; border: 1px dashed var(--border); border-radius: var(--radius); }
textarea {
  width: 100%; min-height: 64px; resize: vertical; background: #0d0a07; color: var(--text); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 8px 10px; font: inherit; font-size: var(--fs-sm); box-sizing: border-box;
}
.muted { color: var(--muted); font-size: var(--fs-sm); line-height: 1.6; margin: 0; }

/* 提示與地名卡 */
.toast {
  position: absolute; top: 52px; left: 50%; transform: translateX(-50%); z-index: 40; max-width: 86%;
  background: var(--panel); border: 1px solid var(--accent); border-radius: var(--radius); padding: 8px 14px;
  font-size: var(--fs-sm); box-shadow: 0 6px 20px #000a; animation: drop 0.2s ease-out; text-align: center;
}
@keyframes drop { from { opacity: 0; transform: translate(-50%, -8px); } }
.placecard {
  position: absolute; left: 0; right: 0; top: 34%; z-index: 39; text-align: center; pointer-events: none;
  animation: card 1.8s ease-out forwards;
}
.placecard b { display: block; font-size: var(--fs-xl); font-weight: 900; letter-spacing: 0.3em; color: var(--gold-hi); text-shadow: 0 2px 0 #000, 0 0 18px #000; }
.placecard small { color: var(--text); letter-spacing: 0.2em; text-shadow: 0 1px 0 #000; }
@keyframes card { 0% { opacity: 0; } 15%, 70% { opacity: 1; } 100% { opacity: 0; } }

/* 寬螢幕的說明欄 */
.notes { display: none; width: 360px; padding-block: 24px; overflow-y: auto; }
.notes h1 { font-size: var(--fs-lg); color: var(--gold-hi); letter-spacing: 0.08em; margin: 0 0 4px; }
.notes-body h3 { font-size: var(--fs-md); color: var(--accent); margin: 16px 0 4px; }
.notes-body p, .notes-body li { color: var(--text); font-size: var(--fs-sm); line-height: 1.7; margin: 0; }
.notes-body ul { padding-left: 1.2em; margin: 0; }
.notes-body .idea { color: var(--muted); }
@media (min-width: 900px) {
  .notes { display: block; }
  .app { box-shadow: 0 0 40px #000c; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style>

<div class="app" id="app">
  <div class="status band">
    <span class="cell"><svg class="ico sm"><use href="#i-sun" id="sunUse"/></svg><b id="clock">第3天 14:00</b></span>
    <span class="cell"><svg class="ico sm"><use href="#i-pin"/></svg><b id="town">河谷鎮</b></span>
    <span class="cell money"><svg class="ico sm"><use href="#i-coin"/></svg><b id="money">1銀 20銅</b></span>
    <button class="bell" id="bellBtn" aria-label="待處理"><svg class="ico"><use href="#i-bell"/></svg><span class="badge" id="bellBadge">2</span></button>
  </div>

  <div class="mapwrap">
    <button class="maphead band" id="mapHead" aria-label="展開或收起地圖">
      <span class="name" id="areaName">河谷鎮</span>
      <span class="sub" id="areaSub">中央平原・點相鄰或遠處的格子移動</span>
      <span class="toggle"><span id="toggleText">收起</span><svg class="ico sm"><use href="#i-chev"/></svg></span>
    </button>
    <div class="grid band" id="grid"></div>
  </div>

  <div class="log band" id="log" aria-live="polite"></div>

  <div class="ctx band" id="ctx" hidden><button id="ctxBtn"></button></div>

  <nav class="tabbar" id="tabbar">
    <button data-tab="map" class="on"><svg class="ico"><use href="#i-map"/></svg><span>地圖</span></button>
    <button data-tab="party"><svg class="ico"><use href="#i-users"/></svg><span>隊伍</span><span class="badge dot" title="有人可以升級"></span></button>
    <button data-tab="rest"><svg class="ico"><use href="#i-moon"/></svg><span>休息</span></button>
    <button data-tab="here"><svg class="ico"><use href="#i-here"/></svg><span>這裡</span><span class="badge gold" id="hereBadge" hidden></span></button>
    <button data-tab="more"><svg class="ico"><use href="#i-dots"/></svg><span>更多</span><span class="badge gold">1</span></button>
  </nav>
</div>

<aside class="notes band">
  <h1>手機版樣稿</h1>
  <p class="muted">直式單手操作。左邊可以直接點，寬螢幕才會看到這一欄；手機上在「更多 → 樣稿說明」。</p>
  <div class="notes-body" id="notesBody"></div>
</aside>

<script>
(() => {
  // ── 範例資料（樣稿用，不是遊戲的真資料）
  // 圖例：. 街道  # 房屋  , 草地  T 樹  : 石地  B/G/I/M 設施  > < 出口
  const AREAS = {
    town: {
      name: '河谷鎮', sub: '中央平原', start: [1, 3],
      rows: [
        '##G#..##',

  function path(from, to) {
    const key = (p) => p.join(',')
    const prev = new Map([[key(from), null]])
    const q = [from]
    while (q.length) {
      const cur = q.shift()
      if (key(cur) === key(to)) break
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const n = [cur[0] + dx, cur[1] + dy]
        if (!walkable(at(...n)) || prev.has(key(n))) continue
        // 出口只能當終點，不能穿過
        if (AREAS[st.area].exits[at(...n)] && key(n) !== key(to)) continue
        prev.set(key(n), cur)
        q.push(n)
      }
    }
    if (!prev.has(key(to))) return null
    const out = []
    for (let p = to; p && key(p) !== key(from); p = prev.get(key(p))) out.unshift(p)
    return out
  }

        addLog('sys', '短休 1 小時。艾琳用了 1 顆生命骰，<b>+7 生命</b>。'); return renderAll()
      case 'turnin':
        if (st.turnedIn) return toast('沒有可以交付的委託。')
        st.turnedIn = true; st.bell = Math.max(0, st.bell - 1); st.money += 60
        closeSheet(); addLog('sys', '交付委託「清理下水道」，報酬 <b>+60銅</b>。')
        return narrate('gilda', '吉兒妲・冒險者公會')
      case 'goguild':
        closeSheet()
        if (st.area !== 'town') return toast('委託要回河谷鎮的冒險者公會交付。')
        setReading(false)
        return walkTo(2, 0)
      case 'lvl': closeSheet(); return openSheet('party')
      case 'act': {
        const text = $('actText')?.value.trim() || '仔細搜查這附近的痕跡'
        closeSheet(); st.minutes += 10
        addLog('sys', `主動行動：<b>${text}</b>　察覺 d20＋3 = 15，成功。`)
        addLog('story', '你蹲下身，在泥地上找到幾枚新鮮的腳印，鞋底的紋路很深，是城裡少見的軍靴。腳印往東門的方向去了。', '主動行動')
        return setReading(true)
      }
      case 'notes': return openSheet('notes')
      case 'menu': return toast(`樣稿：這裡會打開「${b.dataset.label}」`)
      default: return toast(`樣稿：這裡會打開「${b.textContent.trim()}」`)
    }
  }

  // ── 提示與地名卡
  function toast(text) {
    app.querySelectorAll('.toast').forEach((el) => el.remove())
    const el = document.createElement('div')
    el.className = 'toast'
    el.textContent = text
    app.appendChild(el)
    setTimeout(() => el.remove(), 2200)
  }
  function placeCard(name, sub) {
    const el = document.createElement('div')
    el.className = 'placecard'
    el.innerHTML = `<b>${name}</b><small>${sub}</small>`
    app.appendChild(el)
    setTimeout(() => el.remove(), 1900)
  }

  function renderAll() {
    renderStatus(); renderMap(); renderCtx(); renderTabs()
  }

  // ── 開場：幾行範例日誌
  addLog('sys', '讀取存檔「第 3 天・河谷鎮」。')
  addLog('story', '午後的河谷鎮很安靜，只有鐵匠鋪那邊傳來一下一下的敲打聲。廣場的告示板上，公會新貼的委託在風裡翻動。', '河谷鎮')
  addLog('sys', '這是樣稿：點地圖上的格子移動，走到設施上試試下面的按鈕。')
  renderAll()
})()
</script>
