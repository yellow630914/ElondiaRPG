<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body { margin: 0 } [hidden] { display: none !important }</style>
<title>埃隆迪亞手機版樣稿</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=LXGW+WenKai+TC&display=swap">
<style>
/* 版面：手機直式單欄。上：狀態列（只看）→ 地圖或旅途進度（探索時大、閱讀時縮成一條）→ 日誌 → 主動行動列 → 情境按鈕 → 底部分頁列
   快速操作用半屏面板；內容多的（隊伍、角色詳情、交易、事件、更多裡的功能）用全螢幕頁面，左上角「←返回」。
   寬螢幕時旁邊多一欄「樣稿說明」。配色沿用遊戲 src/style.css 的皮革與金色，只做深色一套。 */
:root {
  --bg: #120d09;
  --panel: #221a13;
  --panel-2: #2d231a;
  --border: #4a3a28;
  --text: #efe4cc;
  --muted: #9a8768;
  --accent: #d9a54a;
  --gold-hi: #f0d083;
  --gold-lo: #6d5128;
  --danger: #d8604e;
  --good: #7cba6a;
  --hp: #c8483a;
  --hp-lo: #5a1c16;
  --jade: #7fb5a2;
  --parch: #ecdcb6;
  --parch-2: #dfc896;
  --ink: #33231a;
  --ink-2: #6b5038;
  --tile-street: #4a3c2c;
  --tile-house: #15100b;
  --tile-grass: #2c3a20;
  --tile-tree: #1d2a16;
  --tile-stone: #2a2622;
  --scrim: #000000a6;
  --font-body: 'Noto Serif TC', 'Noto Serif CJK TC', 'PMingLiU', serif;
  --font-story: 'LXGW WenKai TC', 'Noto Serif TC', serif;
  --fs-xs: 0.72rem; --fs-sm: 0.84rem; --fs-md: 0.95rem; --fs-lg: 1.1rem; --fs-xl: 1.5rem;
  --radius: 4px;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 15px;
  display: flex; justify-content: center; gap: 32px; overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
button:disabled { cursor: default; opacity: 0.45; }
button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
.ico { width: 22px; height: 22px; flex: none; }
.ico.sm { width: 16px; height: 16px; }

/* ── 手機本體 */
.app {
  position: relative; width: 100%; max-width: 440px; height: 100%;
  display: flex; flex-direction: column; background: var(--bg); overflow: hidden;
  border-left: 1px solid var(--border); border-right: 1px solid var(--border);
}
.band { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* 狀態列：只看不按（鈴鐺例外） */
.status {
  flex: none; display: flex; align-items: center; gap: 10px; padding-block: 8px;
  background: linear-gradient(180deg, #2a2017, #1d1611); border-bottom: 1px solid var(--gold-lo);
  font-size: var(--fs-sm); font-variant-numeric: tabular-nums; white-space: nowrap;
}
.status .cell { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); min-width: 0; }
.status .cell b { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.status .money b { color: var(--gold-hi); }
.status .bell { margin-left: auto; position: relative; display: grid; place-items: center; width: 40px; height: 36px; color: var(--gold-hi); }
.badge {
  position: absolute; top: 0; right: 2px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px;
  background: var(--danger); color: #fff; font: 700 11px/17px system-ui, sans-serif; text-align: center;
}
.badge.gold { background: var(--accent); color: var(--ink); }
.badge.dot { min-width: 9px; width: 9px; height: 9px; padding: 0; top: 6px; right: calc(50% - 18px); }

/* 地圖與旅途 */
.mapwrap { flex: none; border-bottom: 1px solid var(--border); background: var(--panel); }
.maphead { display: flex; align-items: center; gap: 8px; padding-block: 8px; width: 100%; text-align: left; }
.maphead .name { font-weight: 900; color: var(--gold-hi); letter-spacing: 0.06em; white-space: nowrap; }
.maphead .sub { color: var(--muted); font-size: var(--fs-xs); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.maphead .toggle { display: inline-flex; align-items: center; gap: 2px; color: var(--accent); font-size: var(--fs-sm); white-space: nowrap; }
.maphead .toggle .ico { transition: transform 0.2s; }
.app.reading .maphead .toggle .ico { transform: rotate(180deg); }
.app.reading .grid, .app.reading .road { display: none; }
.grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 2px; padding-bottom: 10px; }
.tile {
  position: relative; aspect-ratio: 1; max-width: 100%; border-radius: 2px; display: grid; place-items: center;
  font-size: var(--fs-xs); font-weight: 600; color: var(--text); line-height: 1.05; text-align: center;
  box-shadow: inset 0 0 0 1px #00000055; cursor: default;
}
.tile.street { background: var(--tile-street); }
.tile.house { background: var(--tile-house); }
.tile.grass { background: var(--tile-grass); }
.tile.tree { background: var(--tile-tree); }
.tile.stone { background: var(--tile-stone); }
.tile.bld { background: #4b3420; box-shadow: inset 0 0 0 1px var(--gold-lo); color: var(--gold-hi); }
.tile.exit { background: #1f2d2a; box-shadow: inset 0 0 0 1px var(--jade); color: #a9d8c6; }
/* 只有相鄰、能走的格子能點；其他格子點了不會動 */
.tile.near { cursor: pointer; }
.tile.near::after { content: ''; position: absolute; inset: 3px; border: 1px dashed #f0d08088; border-radius: 2px; pointer-events: none; }
.grid.pulse .tile.near::after { animation: near-pulse 0.5s steps(3, end); }
@keyframes near-pulse { 50% { border-color: var(--gold-hi); border-style: solid; box-shadow: 0 0 8px #f0d083aa; } }
.tile .who { position: absolute; right: 2px; top: 1px; font-size: 10px; color: #8fd0ff; }
.hero {
  position: absolute; inset: 18%; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff1c6, #e2b45a 55%, #a87528);
  box-shadow: 0 0 0 2px #120d09, 0 0 10px #f0d083aa;
}
.road { padding-block: 4px 12px; display: flex; flex-direction: column; gap: 8px; }
.track { display: flex; align-items: center; gap: 0; }
.track .stop {
  position: relative; flex: 1; min-width: 0; height: 40px; display: grid; place-items: center; font-size: var(--fs-xs);
  color: var(--muted); background: var(--tile-street); box-shadow: inset 0 0 0 1px #00000055;
}
.track .stop.town { flex: 1.6; background: #4b3420; color: var(--gold-hi); font-weight: 600; box-shadow: inset 0 0 0 1px var(--gold-lo); }
.track .stop.passed { background: #2a2219; color: #6d5d47; }
.track .stop.event { color: var(--accent); font-weight: 900; }
.track .stop { height: 46px; align-items: end; padding-bottom: 5px; box-sizing: border-box; }
.track .stop .hero { inset: 5px auto auto 50%; width: 16px; height: 16px; transform: translateX(-50%); }
.road .info { display: flex; justify-content: space-between; font-size: var(--fs-xs); color: var(--muted); }
.road .info b { color: var(--text); font-weight: 600; }

/* 日誌 */
.log { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-block: 10px 14px; display: flex; flex-direction: column; gap: 8px; scroll-behavior: smooth; }
.entry { font-size: var(--fs-sm); color: var(--muted); display: flex; gap: 8px; line-height: 1.55; }
.entry time { flex: none; font-variant-numeric: tabular-nums; color: var(--gold-lo); }
.entry b { color: var(--text); font-weight: 600; }
.entry .roll { display: inline-block; padding: 0 6px; margin-left: 4px; border-radius: 2px; background: #0006; border: 1px solid var(--gold-lo); color: var(--gold-hi); font-variant-numeric: tabular-nums; }
.entry .ok { color: var(--good); } .entry .bad { color: var(--danger); }
.entry.story {
  display: block; background: linear-gradient(180deg, var(--parch), var(--parch-2)); color: var(--ink);
  font-family: var(--font-story); font-size: 1rem; line-height: 1.85; padding: 12px 14px; border-radius: var(--radius);
  box-shadow: inset 0 0 0 1px #b8955a, 0 4px 12px #0007;
}
.entry.story .who { display: block; font-family: var(--font-body); font-size: var(--fs-xs); color: var(--ink-2); margin-bottom: 4px; }
/* 等待判定的行動：日誌最下面的卡片，判定完換成結果 */
.entry.pending {
  display: block; position: relative; padding: 10px 12px 10px 16px; border: 1px dashed var(--accent); border-radius: 3px; background: #00000040; color: var(--text);
}
.entry.pending::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); }
.entry.pending.judging::before { animation: blink 1s ease-in-out infinite; }
@keyframes blink { 50% { opacity: 0.25; } }
.entry.pending .ph { display: flex; align-items: center; gap: 6px; font-weight: 900; color: var(--gold-hi); }
.entry.pending .ph span { margin-left: auto; font-size: var(--fs-xs); font-weight: 400; color: var(--accent); }
.entry.pending p { margin: 4px 0; }
.entry.pending .dice { color: var(--accent); font-size: 1.15rem; font-weight: 900; }
.entry.pending .totals { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: var(--fs-xs); color: var(--muted); }
.entry.pending .totals .def { color: var(--accent); }
.entry.pending .btns { display: flex; gap: 6px; margin-top: 8px; }
.entry.new { animation: slide-in 0.3s ease-out; }
@keyframes slide-in { from { opacity: 0; transform: translateY(6px); } }

/* 主動行動列：平常一行，點了展開 */
.composer { flex: none; border-top: 1px solid var(--border); background: #1a140f; padding-block: 8px; }
.composer .closed {
  width: 100%; min-height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 12px; text-align: left;
  border: 1px solid var(--border); border-radius: 20px; background: #0d0a07; color: var(--muted); font-size: var(--fs-sm);
}
.composer .closed .ico { color: var(--accent); }
.composer .closed .tg { margin-left: auto; color: var(--accent); font-size: var(--fs-xs); }
.composer .open { display: flex; flex-direction: column; gap: 6px; }
.composer .line { display: flex; gap: 6px; align-items: center; }
.composer .line select { flex: 1; min-width: 0; }
.composer .line h3 { margin: 0; font-size: var(--fs-sm); color: var(--gold-hi); display: flex; align-items: center; gap: 4px; flex: 1; }
.composer .chip-btn { font-size: var(--fs-xs); padding: 4px 8px; border: 1px solid var(--gold-lo); border-radius: 12px; color: var(--accent); white-space: nowrap; }
.composer .fold { width: 32px; height: 32px; display: grid; place-items: center; color: var(--muted); }
.composer .fold .ico { transform: rotate(180deg); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.tchip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 4px 1px 8px; border: 1px solid var(--border); border-radius: 3px; font-size: var(--fs-xs); background: #0003; }
.tchip.main { border-color: var(--accent); }
.tchip button { color: var(--muted); padding: 0 4px; }
select, textarea {
  background: #0d0a07; color: var(--text); border: 1px solid var(--border); border-radius: var(--radius);
  font: inherit; font-size: var(--fs-sm); min-height: 36px; padding: 4px 8px; box-sizing: border-box; max-width: 100%;
}
textarea { width: 100%; min-height: 40px; resize: none; }

/* 情境按鈕：站在設施上、或在旅途中才出現 */
.ctx { flex: none; padding-block: 8px; background: var(--panel); border-top: 1px solid var(--border); }
.ctx button {
  width: 100%; min-height: 46px; display: flex; align-items: center; justify-content: center; gap: 8px;
  background: linear-gradient(180deg, #e5b75a, #b2822f); color: #22160b; font-weight: 900; letter-spacing: 0.08em;
  border-radius: var(--radius); box-shadow: inset 0 0 0 1px #f0d083, 0 3px 10px #0008;
}

/* 底部分頁列 */
.tabbar { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); background: linear-gradient(180deg, #2a2017, #17110c); border-top: 1px solid var(--gold-lo); }
.tabbar button {
  position: relative; min-height: 58px; display: grid; justify-items: center; align-content: center; gap: 3px;
  color: var(--muted); font-size: var(--fs-xs);
}
.tabbar button .ico { color: var(--accent); }
.tabbar button.on { color: var(--gold-hi); }
.tabbar button.on::before { content: ''; position: absolute; top: 0; left: 22%; right: 22%; height: 2px; background: var(--accent); }

/* 半屏面板 */
.scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 20; animation: fade 0.2s; }
@keyframes fade { from { opacity: 0; } }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 72%; display: flex; flex-direction: column;
  background: linear-gradient(180deg, #2a2017, #1d1611); border-top: 1px solid var(--accent); border-radius: 12px 12px 0 0;
  box-shadow: 0 -10px 30px #000b; animation: up 0.22s ease-out; transition: max-height 0.22s;
}
.sheet.full { max-height: 94%; }
@keyframes up { from { transform: translateY(40%); opacity: 0.4; } }
.sheet .grip { flex: none; display: grid; place-items: center; height: 22px; width: 100%; }
.sheet .grip::before { content: ''; width: 44px; height: 4px; border-radius: 2px; background: var(--gold-lo); }
.sheet header { flex: none; display: flex; align-items: center; gap: 8px; padding-block: 0 10px; }
.sheet header h2, .page header h2 { margin: 0; font-size: var(--fs-lg); font-weight: 900; color: var(--gold-hi); letter-spacing: 0.08em; flex: 1; text-wrap: balance; }
.sheet header .x { width: 36px; height: 36px; display: grid; place-items: center; color: var(--muted); }
.sheet .body, .page .body { overflow-y: auto; overscroll-behavior: contain; padding-block: 4px 18px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }

/* 全螢幕頁面：左上角返回 */
.page {
  position: absolute; inset: 0; z-index: 30; display: flex; flex-direction: column; background: var(--bg);
  animation: slide-left 0.22s ease-out;
}
@keyframes slide-left { from { transform: translateX(30%); opacity: 0.3; } }
.page header {
  flex: none; display: flex; align-items: center; gap: 4px; padding-block: 6px; min-height: 48px; box-sizing: border-box;
  background: linear-gradient(180deg, #2a2017, #1d1611); border-bottom: 1px solid var(--gold-lo);
}
.page header .back { display: inline-flex; align-items: center; gap: 2px; min-height: 40px; padding-right: 10px; color: var(--accent); font-size: var(--fs-md); }
.page header .back .ico { transform: rotate(-90deg); }
.page header h2 { text-align: center; padding-right: 64px; }
.page .body { flex: 1; padding-block: 12px 24px; }
/* 有分頁的頁面：所有分頁並排在一條軌道上，左右滑時跟著手指，放開後用緩動停到位置（直的捲動照舊） */
.page .body.swipeable { touch-action: pan-y; }
.viewport { overflow: hidden; margin-inline: -2px; padding-inline: 2px; transition: height 0.3s cubic-bezier(0.22, 0.61, 0.36, 1); }
.track { display: flex; align-items: flex-start; will-change: transform; transition: transform 0.34s cubic-bezier(0.22, 0.61, 0.36, 1); }
.pane { flex: 0 0 100%; min-width: 0; display: flex; flex-direction: column; gap: 12px; box-sizing: border-box; }
.seg { position: relative; }
.seg button.on { border-bottom-color: transparent; }
.seg .ink { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--accent); pointer-events: none; transition: transform 0.34s cubic-bezier(0.22, 0.61, 0.36, 1), width 0.34s cubic-bezier(0.22, 0.61, 0.36, 1); }

.seg { display: flex; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
.seg button { flex: 1 0 auto; padding: 8px 12px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.seg button.on { color: var(--gold-hi); border-bottom-color: var(--accent); }
.section-title { font-size: var(--fs-xs); color: var(--muted); letter-spacing: 0.12em; margin: 4px 0 -4px; }
.list { display: flex; flex-direction: column; gap: 6px; }
.row {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #0000004d; border: 1px solid #ffffff14; border-radius: var(--radius);
}
.row .main { flex: 1; min-width: 0; }
.row .main b { display: block; font-weight: 600; }
.row .main small { color: var(--muted); font-size: var(--fs-xs); }
.btn {
  min-height: 40px; padding: 0 14px; border-radius: var(--radius); background: linear-gradient(180deg, #3b2c1e, #2a1f15);
  border: 1px solid var(--gold-lo); color: var(--text); font-size: var(--fs-sm); white-space: nowrap;
}
.btn.primary { background: linear-gradient(180deg, #e5b75a, #b2822f); border-color: var(--gold-hi); color: #22160b; font-weight: 700; }
.btn.wide { width: 100%; min-height: 48px; }
.btn.opt { display: flex; align-items: center; justify-content: space-between; text-align: left; }
.avatar {
  flex: none; width: 40px; height: 40px; border-radius: 3px; display: grid; place-items: center; font-weight: 900;
  background: #4b3420; color: var(--gold-hi); box-shadow: inset 0 0 0 1px var(--gold-lo);
}
.avatar.big { width: 64px; height: 64px; font-size: 1.6rem; }
.hpbar { height: 6px; border-radius: 3px; background: var(--hp-lo); overflow: hidden; margin-top: 4px; }
.hpbar i { display: block; height: 100%; background: var(--hp); }
.chip { font-size: var(--fs-xs); padding: 1px 6px; border-radius: 2px; background: var(--accent); color: var(--ink); font-weight: 700; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.stats div { text-align: center; padding: 8px 0; background: #0000004d; border: 1px solid #ffffff14; border-radius: var(--radius); }
.stats b { display: block; font-size: var(--fs-lg); color: var(--gold-hi); font-variant-numeric: tabular-nums; }
.stats small { color: var(--muted); font-size: var(--fs-xs); }
.more-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.more-grid button {
  position: relative; min-height: 72px; display: grid; justify-items: center; align-content: center; gap: 6px;
  background: #0000004d; border: 1px solid #ffffff14; border-radius: var(--radius); font-size: var(--fs-xs); color: var(--text);
}
.more-grid button .ico { color: var(--accent); }
.more-grid .badge { top: 4px; right: 6px; }
.empty { color: var(--muted); font-size: var(--fs-sm); padding: 10px 12px; border: 1px dashed var(--border); border-radius: var(--radius); }
.muted { color: var(--muted); font-size: var(--fs-sm); line-height: 1.6; margin: 0; }
.event-text {
  background: linear-gradient(180deg, var(--parch), var(--parch-2)); color: var(--ink); font-family: var(--font-story);
  font-size: 1rem; line-height: 1.85; padding: 14px; border-radius: var(--radius); margin: 0;
}

/* 提示與地名卡 */
.toast {
  position: absolute; top: 52px; left: 50%; transform: translateX(-50%); z-index: 40; max-width: 86%;
  background: var(--panel); border: 1px solid var(--accent); border-radius: var(--radius); padding: 8px 14px;
  font-size: var(--fs-sm); box-shadow: 0 6px 20px #000a; animation: drop 0.2s ease-out; text-align: center;
}
@keyframes drop { from { opacity: 0; transform: translate(-50%, -8px); } }
.placecard {
  position: absolute; left: 0; right: 0; top: 34%; z-index: 39; text-align: center; pointer-events: none;
  animation: card 1.8s ease-out forwards;
}
.placecard b { display: block; font-size: var(--fs-xl); font-weight: 900; letter-spacing: 0.3em; color: var(--gold-hi); text-shadow: 0 2px 0 #000, 0 0 18px #000; }
.placecard small { color: var(--text); letter-spacing: 0.2em; text-shadow: 0 1px 0 #000; }
@keyframes card { 0% { opacity: 0; } 15%, 70% { opacity: 1; } 100% { opacity: 0; } }

/* 寬螢幕的說明欄 */
.notes { display: none; width: 360px; padding-block: 24px; overflow-y: auto; }
.notes h1 { font-size: var(--fs-lg); color: var(--gold-hi); letter-spacing: 0.08em; margin: 0 0 4px; }
.notes-body h3 { font-size: var(--fs-md); color: var(--accent); margin: 16px 0 4px; }
.notes-body p, .notes-body li { color: var(--text); font-size: var(--fs-sm); line-height: 1.7; margin: 0; }
.notes-body ul { padding-left: 1.2em; margin: 0; }
.notes-body .later { color: var(--muted); }
@media (min-width: 900px) {
  .notes { display: block; }
  .app { box-shadow: 0 0 40px #000c; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style>

<div class="app" id="app">
  <div class="status band">
    <span class="cell"><svg class="ico sm"><use href="#i-sun" id="sunUse"/></svg><b id="clock">第3天 14:00</b></span>
    <span class="cell"><svg class="ico sm"><use href="#i-pin"/></svg><b id="town">河谷鎮</b></span>
    <span class="cell money"><svg class="ico sm"><use href="#i-coin"/></svg><b id="money">1銀 20銅</b></span>

<script>
(() => {
  // ── 範例資料（樣稿用，不是遊戲的真資料）。地圖用遊戲預設的 9×7
  // 圖例：. 街道  # 房屋  , 草地  T 樹  : 石地  G/I/M/B/C 設施  > < D 出口
  const TOWN_ROWS = [
    '###G#I###',
    '#.......#',
    '#.M...B.#',
    'C.......>',
    '#..#.#..#',
    '#.......#',
    '#########',
  ]
  const TOWN_PLACES = {
    G: { name: '冒險者公會', short: '公會', people: ['gilda'], options: [['委託板', 'board'], ['交付委託', 'turnin', 1], ['升階檢定', 'rank']] },
    I: { name: '麥穗旅店', short: '旅店', people: ['hanna'], options: [['住宿（長休）', 'inn'], ['點一份熱湯', 'meal'], ['打聽消息', 'rumor']] },
    M: { name: '河谷市集', short: '市集', people: ['lena'], options: [['購買', 'shop'], ['出售', 'shop']] },
    B: { name: '鐵匠鋪', short: '鐵匠', people: ['bern'], options: [['購買武器防具', 'shop'], ['出售', 'shop'], ['修理裝備', 'repair'], ['委託打造', 'forge']] },
    C: { name: '城門', short: '城門', people: ['guard'], options: [['啟程旅行', 'travel'], ['出城到近郊', 'toplain']] },
  }
  const AREAS = {
    town: {
      name: '河谷鎮', sub: '中央平原', start: [4, 5], rows: TOWN_ROWS, places: TOWN_PLACES,
      exits: { '>': { to: 'plain', label: '近郊', at: [1, 3] } }, street: [],
    },
    town2: {
      name: '萊茵堡', sub: '中央平原・帝國的城市', start: [1, 3], rows: TOWN_ROWS,
      places: { ...TOWN_PLACES, M: { ...TOWN_PLACES.M, name: '萊茵堡市集' }, I: { ...TOWN_PLACES.I, name: '金獅旅店' } },
      exits: { '>': { to: null, label: '近郊' } }, street: [],
    },
    plain: {
      name: '河谷鎮外', sub: '中央平原・建議 F 級', start: [1, 3],
      rows: [
        'TT,,,,,TT',
        'T,,,,,,,T',
        ',,,::,,,T',
        '<,,::,,,D',
        ',,,,,,,,T',
        'TT,,,,,TT',
        'TTT,,,TTT',
      ],
      places: {},
      exits: { '<': { to: 'town', label: '河谷鎮', at: [7, 3] }, D: { to: 'dungeon', label: '古井', at: [2, 1] } },
      street: [],
    },
    dungeon: {
      name: '古井地下城', sub: '第一層・建議 F 級', start: [2, 1],
      rows: [
        '#########',
        '#<::#:::#',
        '#.::#:#:#',
        '#:::::#:#',
        '#::##:::#',
        '#::::::>#',
        '#########',
      ],
      places: {},
      exits: { '<': { to: 'plain', label: '地面', at: [7, 3] }, '>': { to: null, label: '下一層' } },
      street: [],
    },
  }
  const PEOPLE = {
    bern: { name: '博恩', role: '鐵匠・矮人', mood: '專注' },
    gilda: { name: '吉兒妲', role: '公會文書', mood: '忙碌' },
    hanna: { name: '漢娜', role: '旅店老闆娘', mood: '和善' },
    lena: { name: '蕾娜', role: '布料商人', mood: '精明' },
    guard: { name: '巡邏衛兵', role: '城門衛兵', mood: '警戒' },
  }
  const PARTY = [
    { id: 'erin', name: '艾琳', race: '人類', cls: '戰士', lv: 3, hp: 82, note: '', attrs: [16, 12, 10, 11, 13] },
    { id: 'gren', name: '葛倫', race: '矮人', cls: '牧師', lv: 3, hp: 100, note: '', attrs: [13, 9, 11, 16, 12] },
    { id: 'mira', name: '米菈', race: '半精靈', cls: '遊俠', lv: 2, hp: 64, note: '可升級', attrs: [11, 16, 12, 10, 14] },
  ]
  const ATTRS = ['力量', '靈巧', '智力', '信仰', '魅力']
  const STORY = {
    bern: '鐵匠鋪裡熱得像夏天的正午。博恩把剛出爐的劍胚浸進水槽，白霧嘶的一聲竄上屋樑。他抬眼看你，用下巴指了指牆上那排還沒開鋒的短劍：「要現成的就挑那邊。要我替你打一把，得等三天。」',
    gilda: '吉兒妲從一疊委託書後面探出頭，鼻樑上的眼鏡滑到一半。「古井那邊又有人聽見怪聲了。F 級就能接，報酬不多，但公會記你一筆。」她把蓋了章的單子推過來，指尖沾著墨。',
    hanna: '漢娜一邊擦杯子一邊笑：「又要出城？先吃點熱的。」她壓低聲音，「昨晚有兩個外地人在打聽古井的事，付錢很爽快，說話卻不像商人。」',
    lena: '蕾娜把一匹深藍的布攤在你面前，指腹順著紋路滑過去。「萊茵堡來的貨，這個月就這一匹。」她瞄了一眼你磨破的袖口，笑意更深了些。',
    guard: '衛兵上下打量你一眼，手沒離開劍柄。「冒險者？天黑前別在東門外逗留，最近平原上不太平。」',
    rumor: '鄰桌的老獵人放下酒杯：「古井底下不只一層，我年輕時見過第二層的門。門上刻著的東西，不是這一帶的字。」',
  }
  const NOTES = `
    <h3>v2 的改動</h3>
    <ul>
      <li>地圖改成遊戲預設的 9×7。</li>
      <li><b>只能點相鄰的格子</b>；點到其他格子不會動，相鄰的格子閃一下提示。</li>
      <li><b>主動行動在日誌底部</b>：平常一行，點了展開。擲完骰的行動在日誌最下面等判定，判定完換成結果。</li>
      <li><b>內容多的視窗改成全螢幕頁面</b>，左上角「←返回」：隊伍、角色詳情、交易、事件、更多裡的功能。</li>
      <li><b>旅途</b>：走到城門「啟程旅行」，地圖換成旅途進度條，情境按鈕變成「前進一天」。</li>
      <li><b>鍵盤打開時地圖自動收起</b>（在文字框打字時）；鍵盤收起、又沒有新的敘事時，地圖放回來。</li>
      <li><b>有分頁的頁面可以左右滑換分頁</b>：隊伍（隊伍｜行囊）、角色詳情、交易。內容和底線跟著手指移動，拉過四分之一或甩得夠快就換頁，不然彈回。</li>
      <li><b>手機的返回鍵</b>（Android 返回鍵、iPhone 邊緣右滑）和左上角「返回」一樣：先關頁面，再關半屏面板，都關了才離開。</li>
      <li><b>從半屏面板打開的頁面，按返回會回到那個面板</b>（例如「更多 → 筆記 → 返回」回到「更多」，「鐵匠鋪 → 購買 → 返回」回到鐵匠鋪）。</li>
    </ul>
    <h3>主畫面：地圖＋日誌</h3>
    <ul>
      <li><b>探索狀態</b>：地圖大、日誌小，連續點格子移動。</li>
      <li><b>閱讀狀態</b>：AI 寫了一段敘事時自動切過來，地圖縮成一條。</li>
      <li>點地圖那一條或底部「地圖」切換。</li>
      <li>走到青色的出口格就換區域（出城、進地下城、下一層）。</li>
    </ul>
    <h3>半屏面板 vs 全螢幕頁面</h3>
    <ul>
      <li>半屏面板（快速操作）：這裡、休息、設施、更多、旅行目的地。</li>
      <li>全螢幕頁面（內容多）：隊伍、角色詳情、交易、事件、關係、筆記、工藝、契約、存讀檔、設定。頁面裡再開頁面，返回會回到上一頁。</li>
    </ul>
    <h3>底部分頁列</h3>
    <ul>
      <li>地圖｜隊伍（內含行囊分頁）｜休息｜這裡（這裡的人、意圖）｜更多</li>
      <li>設施用情境按鈕：站在設施上才出現「進入○○」。</li>
    </ul>
    <h3>之後再做</h3>
    <ul class="later">
      <li>戰鬥畫面（等慾望戰鬥的慾望條定案）。</li>
      <li>電腦版維持原樣，只在 720px 以下換成這套版面。</li>
    </ul>
  `

  // ── 狀態
  const st = {
    area: 'town', pos: [4, 5], minutes: 3 * 1440 + 14 * 60, money: 120,
    reading: false, sheet: null, pages: [], bell: 2, turnedIn: false,
    road: null, composerOpen: false, targets: [], ai: true, pending: null, judging: false, draft: '',
  }
  const $ = (id) => document.getElementById(id)
  const app = $('app'), grid = $('grid'), log = $('log')
  $('notesBody').innerHTML = NOTES

  // ── 時間與金錢
  const pad = (n) => String(n).padStart(2, '0')
  function clockText() {
    const d = Math.floor(st.minutes / 1440), h = Math.floor((st.minutes % 1440) / 60), m = st.minutes % 60
    return { full: `第${d}天 ${pad(h)}:${pad(m)}`, hm: `${pad(h)}:${pad(m)}`, day: h >= 6 && h < 18 }
  }
  const moneyText = (cc) => `${Math.floor(cc / 100)}銀 ${cc % 100}銅`
  function renderStatus() {
    const c = clockText()
    $('clock').textContent = c.full
    $('sunUse').setAttribute('href', c.day ? '#i-sun' : '#i-moon')
    $('money').textContent = moneyText(st.money)
    $('town').textContent = st.road ? '旅途中' : AREAS[st.area].name
    $('bellBadge').textContent = st.bell
    $('bellBadge').hidden = !st.bell
    $('moreBadge').hidden = st.turnedIn
  }

  // ── 日誌
  function addLog(kind, html, who) {
    const el = document.createElement('div')
    el.className = `entry ${kind} new`
    // 有新的敘事：鍵盤收起後也維持閱讀狀態
    if (kind === 'story') kbRestore = null
    if (kind === 'story') el.innerHTML = `<span class="who">${who ?? ''}</span>${html}`
    else el.innerHTML = `<time>${clockText().hm}</time><span>${html}</span>`
    log.insertBefore(el, log.querySelector('.entry.pending'))
    log.scrollTop = log.scrollHeight
    return el
  }
  function narrate(key, who) {
    addLog('story', STORY[key], who)
    setReading(true)
  }

  // ── 鍵盤打開（文字框拿到焦點）時收起地圖；鍵盤收起時，如果中間沒有新的敘事，放回原本的狀態
  let kbRestore = null
  const typing = (el) => el instanceof HTMLTextAreaElement || (el instanceof HTMLInputElement && ['text', 'search', ''].includes(el.type))
  app.addEventListener('focusin', (e) => {
    if (!typing(e.target) || st.reading) return
    kbRestore = { reading: false }
    setReading(true)
  })
  function restoreKb() {
    const back = kbRestore
    kbRestore = null
    if (back && st.reading && !back.reading) setReading(false)
  }
  app.addEventListener('focusout', (e) => {
    if (!typing(e.target)) return
    // 等一下再看：焦點換到另一個文字框、或還在主動行動列裡（選對象、能力）時維持收起；
    // 按「行動」送出時由 perform 決定（AI 會寫敘事就維持收起）
    setTimeout(() => {
      if (typing(document.activeElement) || $('composer').contains(document.activeElement) || !kbRestore) return
      restoreKb()
    }, 200)
  })

  // ── 地圖
  const at = (x, y) => AREAS[st.area].rows[y]?.[x]
  const walkable = (ch) => ch !== undefined && ch !== '#' && ch !== 'T'
  const isNear = (x, y) => Math.abs(x - st.pos[0]) + Math.abs(y - st.pos[1]) === 1
  function cellPlace() {
    if (st.road) return null
    return AREAS[st.area].places[at(...st.pos)] ?? null
  }
  function peopleHere() {
    if (st.road) return []
    const p = cellPlace()
    return p ? p.people : AREAS[st.area].street
  }
  function renderMap() {
    const a = AREAS[st.area]
    grid.hidden = !!st.road
    $('road').hidden = !st.road
    $('toggleText').textContent = st.reading ? (st.road ? '展開旅途' : '展開地圖') : '收起'
    if (st.road) return renderRoad()
    $('areaName').textContent = a.name
    const p = cellPlace()
    $('areaSub').textContent = st.reading ? (p ? `${a.sub}・在${p.name}` : a.sub) : `${a.sub}・點旁邊的格子移動`
    grid.innerHTML = ''
    a.rows.forEach((row, y) => [...row].forEach((ch, x) => {
      const b = document.createElement('button')
      const near = isNear(x, y) && walkable(ch)
      let cls = 'street', label = ''
      if (ch === '#') cls = 'house'
      else if (ch === ',') cls = 'grass'
      else if (ch === 'T') cls = 'tree'
      else if (ch === ':') cls = 'stone'
      else if (a.places[ch]) { cls = 'bld'; label = a.places[ch].short }
      else if (a.exits[ch]) { cls = 'exit'; label = a.exits[ch].label }
      b.className = `tile ${cls}${near ? ' near' : ''}`
      b.innerHTML = label
      b.setAttribute('aria-label', label || (near ? '走到這一格' : '地圖格'))
      const ppl = a.places[ch]?.people.length
      if (ppl) b.insertAdjacentHTML('beforeend', `<span class="who">●${ppl}</span>`)
      if (x === st.pos[0] && y === st.pos[1]) b.insertAdjacentHTML('beforeend', '<span class="hero"></span>')
      b.addEventListener('click', () => step(x, y))
      grid.appendChild(b)
    }))
  }
  // 只走相鄰的一格；點到別的格子不動，讓相鄰的格子閃一下
  function step(x, y) {
    if (!isNear(x, y) || !walkable(at(x, y))) {
      if (x === st.pos[0] && y === st.pos[1]) return
      grid.classList.remove('pulse')
      void grid.offsetWidth
      grid.classList.add('pulse')
      return
    }
    st.pos = [x, y]
    st.minutes += 5
    const ch = at(x, y)
    const exit = AREAS[st.area].exits[ch]
    if (exit) return useExit(exit)
    const p = cellPlace()
    if (p) addLog('sys', `來到<b>${p.name}</b>。`)
    renderAll()
  }
  function useExit(exit) {
    if (!exit.to) {
      toast(`樣稿沒有做「${exit.label}」；真的遊戲會換到那一區。`)
      st.pos = AREAS[st.area].start
      return renderAll()
    }
    goArea(exit.to, exit.at)
  }
  function goArea(key, pos) {
    st.area = key
    st.pos = pos ?? AREAS[key].start
    st.targets = []
    const a = AREAS[key]
    addLog('sys', `進入<b>${a.name}</b>。`)
    placeCard(a.name, a.sub)
    renderAll()
  }
  function setReading(on) {
    st.reading = on
    app.classList.toggle('reading', on)
    // 不重畫主動行動列：重畫會換掉文字框，焦點跑掉、鍵盤就收起來了
    renderStatus(); renderMap(); renderCtx(); renderTabs()
    log.scrollTop = log.scrollHeight
  }
  $('mapHead').addEventListener('click', () => setReading(!st.reading))

  // ── 旅途：一格一天
  const ROUTES = { town: [{ to: 'town2', name: '萊茵堡', days: 3, events: { 2: 'caravan' } }], town2: [{ to: 'town', name: '河谷鎮', days: 3, events: {} }] }
  function startTravel(route) {
    st.road = { from: AREAS[st.area].name, to: route.to, toName: route.name, days: route.days, day: 0, events: { ...route.events }, done: {} }
    st.targets = []
    addLog('sys', `從<b>${AREAS[st.area].name}</b>出發，前往<b>${route.name}</b>（${route.days} 天）。`)
    setReading(false)
  }
  function renderRoad() {
    const r = st.road
    $('areaName').textContent = '旅途'
    $('areaSub').textContent = `${r.from} → ${r.toName}・第 ${r.day}／${r.days} 天`
    const stops = []
    for (let i = 0; i <= r.days; i++) {
      const end = i === 0 || i === r.days
      const passed = i < r.day
      const ev = r.events[i] && !r.done[i]
      const label = i === 0 ? r.from : i === r.days ? r.toName : ev ? '?' : r.done[i] ? '✓' : `${i}`
      stops.push(`<div class="stop${end ? ' town' : ''}${passed ? ' passed' : ''}${ev ? ' event' : ''}">${label}${i === r.day ? '<span class="hero"></span>' : ''}</div>`)
    }
    $('road').innerHTML = `<div class="track">${stops.join('')}</div>
      <div class="info"><span>預計 <b>第 ${Math.floor(st.minutes / 1440) + (r.days - r.day)} 天</b>抵達</span><span>「?」是路上會遇到的事</span></div>`
  }
  function advanceDay() {
    const r = st.road
    r.day += 1
    st.minutes += 1440
    if (r.day >= r.days) {
      st.road = null
      addLog('sys', `抵達<b>${r.toName}</b>。`)
      return goArea(r.to, AREAS[r.to].start)
    }
    addLog('sys', `在路上走了一天（第 ${r.day}／${r.days} 天）。`)
    if (r.events[r.day]) return openPage('event', { id: r.events[r.day] })
    renderAll()
  }

  // ── 情境按鈕
  function renderCtx() {
    const p = cellPlace()
    $('ctx').hidden = !p && !st.road
    $('ctxBtn').textContent = st.road ? (st.road.day + 1 >= st.road.days ? `前進一天，抵達${st.road.toName}` : '前進一天') : p ? `進入${p.name}` : ''
    $('ctxBtn').disabled = !!st.pending || st.judging
  }
  $('ctxBtn').addEventListener('click', () => (st.road ? advanceDay() : openSheet('place')))

  // ── 主動行動列（日誌底部）
  function targetOptions() {
    const party = PARTY.filter((m) => m.id !== 'erin').map((m) => [m.id, m.name])
    const here = peopleHere().map((id) => [id, PEOPLE[id].name])
    return { party, here }
  }
  const nameOf = (id) => PEOPLE[id]?.name ?? PARTY.find((m) => m.id === id)?.name ?? id
  function renderComposer() {
    const c = $('composer')
    const busy = !!st.pending || st.judging
    // 正在文字框裡打字時不重畫（保住焦點與鍵盤）
    if (st.composerOpen && c.contains(document.activeElement) && document.activeElement.id === 'cmpText') return
    if (!st.composerOpen) {
      c.innerHTML = `<button class="closed" id="cmpOpen" ${busy ? 'disabled' : ''}>
        <svg class="ico sm"><use href="#i-d20"/></svg>
        <span>${busy ? '先完成日誌裡等待判定的行動' : '主動行動：想做什麼…'}</span>
        ${st.targets.length ? `<span class="tg">對象 ${st.targets.map(nameOf).join('、')}</span>` : ''}
      </button>`
      $('cmpOpen').addEventListener('click', () => { st.composerOpen = true; renderComposer(); $('cmpText')?.focus() })
      return
    }
    const { party, here } = targetOptions()
    const opt = (list) => list.map(([id, n]) => `<option value="${id}" ${st.targets.includes(id) ? 'disabled' : ''}>${n}</option>`).join('')
    c.innerHTML = `<div class="open">
      <div class="line">
        <h3><svg class="ico sm"><use href="#i-d20"/></svg>主動行動</h3>
        <button class="chip-btn" id="cmpAi" title="點一下切換">${st.ai ? 'AI 判定' : '規則判定'}</button>
        <button class="fold" id="cmpFold" aria-label="收起主動行動"><svg class="ico sm"><use href="#i-chev"/></svg></button>
      </div>
      <div class="line">
        <select id="cmpTarget" aria-label="對象" ${st.targets.length >= 3 ? 'disabled' : ''}>
          <option value="">${st.targets.length ? '＋ 再加一位對象' : '（沒有特定對象）'}</option>
          <optgroup label="隊伍">${opt(party)}</optgroup>
          ${here.length ? `<optgroup label="身邊的人">${opt(here)}</optgroup>` : ''}
        </select>
        <select id="cmpUse" aria-label="搭配能力"><option>不搭配能力</option><option>米菈：魅惑術（1 環）</option><option>葛倫：祝福</option></select>
      </div>
      ${st.targets.length ? `<div class="chips">${st.targets.map((id, i) => `<span class="tchip${i === 0 ? ' main' : ''}">${i === 0 ? '主要・' : ''}${nameOf(id)}<button data-rm="${id}" aria-label="移掉${nameOf(id)}">×</button></span>`).join('')}</div>` : ''}
      <div class="line">
        <textarea id="cmpText" rows="1" placeholder="例如：買一份甜點給蕾娜，順便問她布是從哪裡來的">${st.draft.replace(/</g, '&lt;')}</textarea>
        <button class="btn primary" id="cmpGo">行動</button>
      </div>
    </div>`
    $('cmpFold').addEventListener('click', () => { st.composerOpen = false; renderComposer(); restoreKb() })
    $('cmpText').addEventListener('input', (e) => { st.draft = e.target.value })
    $('cmpAi').addEventListener('click', () => { st.ai = !st.ai; renderComposer() })
    $('cmpTarget').addEventListener('change', (e) => { if (e.target.value) st.targets.push(e.target.value); renderComposer(); $('cmpTarget').focus() })
    c.querySelectorAll('[data-rm]').forEach((b) => b.addEventListener('click', () => { st.targets = st.targets.filter((x) => x !== b.dataset.rm); renderComposer() }))
    $('cmpGo').addEventListener('click', () => {
      const text = $('cmpText').value.trim()
      if (!text) return $('cmpText').focus()
      perform(text)
    })
  }
  // 擲骰 → 日誌最下面出現等待判定的卡片 → 判定完換成結果
  function perform(text) {
    // 送出後收起鍵盤（手機上點按鈕時焦點可能還留在文字框）
    if (document.activeElement?.id === 'cmpText') document.activeElement.blur()
    st.draft = ''
    const natural = 1 + Math.floor(Math.random() * 20)
    const target = st.targets[0]
    st.pending = { text, natural, dc: 12, target, attr: 4 }
    st.composerOpen = false
    st.targets = []
    st.minutes += 10
    const pc = PARTY[0]
    const totals = ATTRS.map((n, i) => `<span class="${i === 4 ? 'def' : ''}">${n} ${natural + Math.floor((pc.attrs[i] - 10) / 2)}</span>`).join('')
    const card = document.createElement('div')
    card.className = 'entry pending new'
    card.innerHTML = `<div class="ph"><svg class="ico sm"><use href="#i-d20"/></svg>自由行動${target ? `（${nameOf(target)}）` : ''}<span id="pendState">等待判定</span></div>
      <p>「${text.replace(/</g, '&lt;')}」</p>
      <p>自然骰 <span class="dice">${natural}</span>・參考 DC 12</p>
      <div class="totals">${totals}</div>
      <div class="btns"><button class="btn primary" data-judge="ai">AI 判定</button><button class="btn" data-judge="rule">依規則判定（魅力）</button></div>`
    log.appendChild(card)
    log.scrollTop = log.scrollHeight
    // 鍵盤打開前是探索狀態：AI 會寫敘事，維持收起讓人讀；規則判定沒有敘事，地圖放回來
    if (st.ai) kbRestore = null
    else restoreKb()
    renderAll()
    // 開著 AI 判定時直接送出（真的遊戲也是）；判定中卡片留在原地
    if (st.ai) judge(true)
    else judge(false)
  }
  function judge(ai) {
    const p = st.pending
    const card = log.querySelector('.entry.pending')
    if (!p || !card) return
    if (ai) {
      st.judging = true
      card.classList.add('judging')
      $('pendState').textContent = 'AI 判定中…'
      card.querySelectorAll('[data-judge]').forEach((b) => (b.disabled = true))
      renderAll()
      setTimeout(() => finish(true), 1600)
    } else finish(false)
  }
  function finish(ai) {
    const p = st.pending
    const card = log.querySelector('.entry.pending')
    const total = p.natural + 1
    const ok = total >= p.dc
    st.pending = null
    st.judging = false
    card?.remove()
    addLog('sys', `自由行動${p.target ? `（${nameOf(p.target)}）` : ''}：<b class="${ok ? 'ok' : 'bad'}">${ok ? '成功' : '失敗'}</b><span class="roll">${p.natural}＋1 = ${total} 對 DC ${p.dc}</span>`)
    if (ai) {
      const who = p.target ? nameOf(p.target) : '路人'
      addLog('story', ok
        ? `${who}聽完你的話，沉默了一會兒，終於點了點頭。「好吧，就照你說的。」語氣裡還帶著一點保留，但比剛才鬆動多了。`
        : `${who}皺起眉頭，往後退了半步。「我不覺得這是個好主意。」話說得客氣，眼神卻已經轉開了。`, `主動行動・${st.road ? '旅途' : AREAS[st.area].name}`)
      setReading(true)
    } else renderAll()
  }
  log.addEventListener('click', (e) => {
    const b = e.target.closest('[data-judge]')
    if (b && !st.judging) judge(b.dataset.judge === 'ai')
  })

  // ── 分頁列
  function renderTabs() {
    document.querySelectorAll('.tabbar button').forEach((b) => {
      const t = b.dataset.tab
      b.classList.toggle('on', t === 'map' ? !st.reading && !st.sheet : st.sheet === t)
    })
    const n = peopleHere().length
    $('hereBadge').hidden = !n
    $('hereBadge').textContent = n
  }
  $('tabbar').addEventListener('click', (e) => {
    const b = e.target.closest('button')
    if (!b) return
    const t = b.dataset.tab
    if (t === 'map') { closeSheet(); setReading(!st.reading); return }
    if (t === 'party') { closeSheet(); return openPage('party') }
    st.sheet === t ? closeSheet() : openSheet(t)
  })
  $('bellBtn').addEventListener('click', () => { closeSheet(); openPage('bell') })

  // ── 半屏面板（快速操作）

          <div class="section-title">意圖</div>
          <div class="row"><div class="main"><b>調查古井的怪聲</b><small>公會委託・F 級</small></div><button class="btn" data-act="intent">更換</button></div>

          <div class="row"><div class="main"><b>生命骰</b><small>艾琳 2/3・葛倫 3/3・米菈 1/2</small></div></div>
          <div class="two"><button class="btn wide" data-act="short">短休 1 小時</button><button class="btn wide primary" data-act="long">長休 8 小時</button></div>`,

    }

          <div class="row"><div class="main"><b>晨光城</b><small>5 天・樣稿沒有做</small></div><button class="btn" disabled>出發</button></div>

      return {

    return null
  }
  function peopleRows(ids) {

  // ── 全螢幕頁面（內容多）：左上角返回；頁面裡開頁面，返回回到上一頁

      tabs: [['buy', '店裡的商品'], ['sell', '我的行囊']], get: () => shopTab, set: (v) => (shopTab = v),
      render: (k) => (k === 'buy'
        ? `<div class="list">${SHOP.map(([n, kk, cc]) => `<div class="row"><div class="avatar">${n[0]}</div><div class="main"><b>${n}</b><small>${kk}・${moneyText(cc)}</small></div><button class="btn" data-act="buy" data-cc="${cc}" data-name="${n}" ${st.money < cc ? 'disabled' : ''}>買</button></div>`).join('')}</div>`
        : bagRows(true)),
    },
  }
  function tabbed(kind, opt, head = '') {
    const t = TABSETS[kind]
    return `${head}<div class="seg">${t.tabs.map(([k, l]) => `<button data-seg="${kind}:${k}" class="${t.get() === k ? 'on' : ''}">${l}</button>`).join('')}<span class="ink"></span></div>
      <div class="viewport"><div class="track">${t.tabs.map(([k]) => `<div class="pane" data-key="${k}">${t.render(k, opt)}</div>`).join('')}</div></div>`
  }
  function pageContent(kind, opt = {}) {
    if (kind === 'party') return { title: '隊伍', body: tabbed('party', opt) }
    if (kind === 'char') return { title: (PARTY.find((x) => x.id === opt.id) ?? PARTY[0]).name, body: tabbed('char', opt) }
    if (kind === 'shop') return { title: opt.place ?? '交易', body: tabbed('shop', opt, `<p class="muted">持有 ${moneyText(st.money)}</p>`) }
    if (kind === 'event') {
      return {
        title: '翻覆的商隊',
        body: `<p class="event-text">路邊一輛貨車翻倒在溝裡，木箱散了一地。車夫抱著腿坐在泥地上，看見你們時先是一愣，接著拚命揮手。樹林那頭，好像有什麼東西在動。</p>
          <div class="list">
            <button class="btn wide opt" data-act="ev" data-r="help"><span>幫忙把車扶起來</span><span class="muted">力量 DC 12</span></button>
            <button class="btn wide opt" data-act="ev" data-r="look"><span>先看看樹林裡有什麼</span><span class="muted">靈巧 DC 13</span></button>
            <button class="btn wide opt" data-act="ev" data-r="leave"><span>繼續趕路</span><span class="muted">不檢定</span></button>
          </div>`,
        noBack: true,
      }
    }
    if (kind === 'bell') {
      return {
        title: '待處理',
        body: st.bell ? `<div class="list">
          <div class="row"><div class="avatar">米</div><div class="main"><b>米菈可以升級</b><small>選一項新能力</small></div><button class="btn primary" data-act="lvl">處理</button></div>
          ${st.turnedIn ? '' : `<div class="row"><div class="avatar">公</div><div class="main"><b>委託可以交付</b><small>冒險者公會・清理下水道</small></div><button class="btn" data-act="goguild">怎麼去</button></div>`}
        </div>` : `<div class="empty">沒有需要處理的事。</div>`,
      }
    }
    if (kind === 'menu') {
      const DESC = {
        關係: '人際關係與冒險記憶：認識的人、親密度、提議。',
        筆記: '冒險筆記：進行中的委託（1 件可以交付）、任務、地點筆記。',
        工藝: '工藝：配方、材料、製作與發明。',
        契約: '奴隸契約：只有身上有契約印記時才出現。',
        存讀檔: '存檔欄位、匯出與匯入。',
        設定: '設定：模型來源、敘事與判定、內容篩選、介面。',
        提示詞: '提示詞管理（電腦版的上方分頁）。',
        世界: '世界管理與編輯器（電腦版的上方分頁；編輯器在手機上可能只能看）。',
      }
      return { title: opt.label, body: `<div class="empty">${DESC[opt.label] ?? opt.label}<br>樣稿只示範這一頁會是全螢幕、左上角可以返回；也可以按手機的返回鍵。</div>` }
    }
    return null
  }
  function bagRows(sell) {
    return `<div class="list">${BAG.map(([n, k, c]) => `<div class="row"><div class="avatar">${n[0]}</div><div class="main"><b>${n}</b><small>${k}</small></div><span class="muted">${c}</span>${sell ? '<button class="btn" data-act="sell">賣</button>' : ''}</div>`).join('')}</div>`
  }

  // 分頁軌道的位置：offset 是手指拖動中的位移（px）；animate 時用緩動滑過去，拖動中不加動畫才會黏手
  function placeTrack(pg, kind, offset = 0, animate = true) {
    const t = TABSETS[kind]
    const vp = pg.querySelector('.viewport'), track = pg.querySelector('.track'), seg = pg.querySelector('.seg'), ink = seg.querySelector('.ink')
    const i = t.tabs.findIndex(([k]) => k === t.get())
    const w = vp.clientWidth || 1
    track.style.transition = vp.style.transition = ink.style.transition = animate ? '' : 'none'
    track.style.transform = `translateX(${-i * w + offset}px)`
    // 底線跟著拖動的比例移到隔壁分頁
    const btns = [...seg.querySelectorAll('button')]
    const p = -offset / w
    const j = Math.max(0, Math.min(btns.length - 1, i + Math.sign(p)))
    const f = Math.min(1, Math.abs(p))
    const a = btns[i], b = btns[j]
    ink.style.width = `${a.offsetWidth + (b.offsetWidth - a.offsetWidth) * f}px`
    ink.style.transform = `translateX(${a.offsetLeft + (b.offsetLeft - a.offsetLeft) * f}px)`
    btns.forEach((x, n) => x.classList.toggle('on', n === i))
    // 高度跟著目前的分頁（各分頁內容長短不同）
    const pane = track.children[i]
    vp.style.height = `${pane.offsetHeight}px`
    if (animate) a.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' })
  }
  function setTab(kind, v) {
    const top = st.pages.at(-1)
    TABSETS[kind].set(v)
    if (top) placeTrack(top.el, kind)
  }
  function bindSwipe(pg, kind) {
    const vp = pg.querySelector('.body')
    vp.classList.add('swipeable')
    vp.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.seg') || !e.isPrimary) return
      const x0 = e.clientX, y0 = e.clientY
      let axis = null, dx = 0, last = { x: x0, t: performance.now() }, v = 0
      const t = TABSETS[kind]
      const i = t.tabs.findIndex(([k]) => k === t.get())
      const w = pg.querySelector('.viewport').clientWidth
      const move = (m) => {
        const mx = m.clientX - x0, my = m.clientY - y0
        if (!axis) {
          if (Math.abs(mx) < 8 && Math.abs(my) < 8) return
          axis = Math.abs(mx) > Math.abs(my) ? 'x' : 'y'
          if (axis === 'y') return end()
        }
        dx = mx
        // 第一頁往右、最後一頁往左：拉得動但有阻力
        if ((i === 0 && dx > 0) || (i === t.tabs.length - 1 && dx < 0)) dx *= 0.3
        const now = performance.now()
        v = (m.clientX - last.x) / Math.max(1, now - last.t)
        last = { x: m.clientX, t: now }
        placeTrack(pg, kind, dx, false)
      }
      const up = () => {
        end()
        if (axis !== 'x') return
        // 拉超過四分之一、或甩得夠快就換頁，否則彈回
        let j = i
        if (dx < -w / 4 || v < -0.45) j = i + 1
        else if (dx > w / 4 || v > 0.45) j = i - 1
        j = Math.max(0, Math.min(t.tabs.length - 1, j))
        t.set(t.tabs[j][0])
        placeTrack(pg, kind)
        // 拖動結束時不要觸發按鈕（放開後馬上跟著的那一下 click）
        if (Math.abs(dx) > 8) {
          const eat = (c) => { c.stopPropagation(); c.preventDefault() }
          window.addEventListener('click', eat, { capture: true, once: true })
          setTimeout(() => window.removeEventListener('click', eat, { capture: true }), 300)
        }
      }
      const end = () => {
        window.removeEventListener('pointermove', move)
        window.removeEventListener('pointerup', up)
        window.removeEventListener('pointercancel', cancel)
      }
      const cancel = () => { end(); if (axis === 'x') placeTrack(pg, kind) }
      window.addEventListener('pointermove', move)
      window.addEventListener('pointerup', up)
      window.addEventListener('pointercancel', cancel)
    })
  }

  // 從半屏面板（更多、設施）打開的頁面蓋在面板上面，按返回就回到原本的面板
  function openPage(kind, opt = {}) {
    const c = pageContent(kind, opt)
    if (!c) return
    const pg = document.createElement('section')
    pg.className = 'page'
    pg.setAttribute('role', 'dialog')
    pg.setAttribute('aria-label', c.title)
    pg.innerHTML = `<header class="band">${c.noBack ? '<span style="width:64px"></span>' : `<button class="back"><svg class="ico sm"><use href="#i-chev"/></svg>返回</button>`}<h2>${c.title}</h2></header>
      <div class="body band">${c.body}</div>`
    pg.querySelector('.back')?.addEventListener('click', closePage)
    pg.addEventListener('click', onAct)
    st.pages.push({ kind, opt, el: pg, noBack: !!c.noBack })
    app.appendChild(pg)
    if (TABSETS[kind]) {
      placeTrack(pg, kind, 0, false)
      bindSwipe(pg, kind)
    }
    syncHistory()
  }
  function closePage() {
    st.pages.pop()?.el.remove()
    renderAll()
    syncHistory()
  }
  function closeAllPages() {
    while (st.pages.length) st.pages.pop().el.remove()
    syncHistory()
  }
  function refreshTop() {
    const top = st.pages.at(-1)
    if (top) {
      const c = pageContent(top.kind, top.opt)
      top.el.querySelector('.body').innerHTML = c.body
      top.el.querySelector('h2').textContent = c.title
      if (TABSETS[top.kind]) placeTrack(top.el, top.kind, 0, false)
      return
    }
    const sh = app.querySelector('.sheet')
    const c = st.sheet && sheetContent(st.sheet)
    if (sh && c) sh.querySelector('.body').innerHTML = c.body
  }

  // ── 手機的返回鍵（Android 返回鍵、iPhone 邊緣右滑、瀏覽器上一頁）：先關最上層的頁面，再關半屏面板，都關了才離開
  // 每打開一層就在瀏覽記錄放一筆；用畫面上的按鈕關掉時，把多的那筆退回去（退回時的 popstate 不算按返回）
  let pushed = 0, ignorePop = 0
  function syncHistory() {
    if (ignorePop) return
    const want = st.pages.length + (st.sheet ? 1 : 0)
    try {
      while (pushed < want) { history.pushState({ elondia: pushed + 1 }, ''); pushed++ }
      if (pushed > want) { ignorePop++; history.go(want - pushed); pushed = want }
    } catch {
      // 瀏覽記錄不能用時，返回鍵照瀏覽器原本的行為
    }
  }
  window.addEventListener('popstate', () => {
    if (ignorePop) { ignorePop--; return syncHistory() }
    pushed = Math.max(0, pushed - 1)
    const top = st.pages.at(-1)
    if (top?.noBack) {
      toast('先選一個選項')
      return syncHistory()
    }
    if (top) return closePage()
    if (st.sheet) return closeSheet()
  })

  // ── 面板與頁面裡的按鈕
  function onAct(e) {
    const seg = e.target.closest('[data-seg]')
    if (seg) {
      const [k, v] = seg.dataset.seg.split(':')
      return setTab(k, v)
    }
    const b = e.target.closest('[data-act]')
    if (!b || b.disabled) return
    const act = b.dataset.act
    switch (act) {
      case 'talk': {
        const who = PEOPLE[b.dataset.id]
        closeSheet()
        addLog('sys', `和<b>${who.name}</b>交談。`)
        st.minutes += 10
        return narrate(b.dataset.id, `${who.name}・${AREAS[st.area].name}`)
      }
      case 'toaction':
        closeSheet()
        if (!st.targets.includes(b.dataset.id) && st.targets.length < 3) st.targets.push(b.dataset.id)
        st.composerOpen = true
        renderAll()
        return $('cmpText')?.focus()
      case 'rumor':
        closeSheet(); st.money -= 5; st.minutes += 30
        addLog('sys', '請鄰桌喝一杯，<b>−5銅</b>。')
        return narrate('rumor', AREAS[st.area].places.I.name)
      case 'meal':
        closeSheet(); st.money -= 8; st.minutes += 30
        addLog('sys', '吃了一份熱湯，<b>−8銅</b>，全隊恢復少許生命。'); return renderAll()
      case 'inn': case 'long':
        closeSheet(); st.minutes += 480; if (act === 'inn') st.money -= 20
        addLog('sys', `長休 8 小時${act === 'inn' ? '，住宿 <b>−20銅</b>' : ''}。全隊生命與法術回滿。`); return renderAll()
      case 'short':
        closeSheet(); st.minutes += 60
        addLog('sys', '短休 1 小時。艾琳用了 1 顆生命骰，<b>+7 生命</b>。'); return renderAll()
      case 'turnin':
        if (st.turnedIn) return toast('沒有可以交付的委託。')
        st.turnedIn = true; st.bell = Math.max(0, st.bell - 1); st.money += 60
        closeSheet(); addLog('sys', '交付委託「清理下水道」，報酬 <b>+60銅</b>。')
        return narrate('gilda', '吉兒妲・冒險者公會')
      case 'goguild':
        closeAllPages(); closeSheet(); renderAll()
        return toast(st.area === 'town' && !st.road ? '冒險者公會在鎮上北邊（地圖上的「公會」）。' : '委託要回河谷鎮的冒險者公會交付。')
      case 'lvl': closeAllPages(); charTab = 'abil'; return openPage('char', { id: 'mira' })
      case 'char': charTab = 'stats'; return openPage('char', { id: b.dataset.id })
      case 'shop': { const p = cellPlace(); shopTab = 'buy'; return openPage('shop', { place: p?.name }) }
      case 'buy':
        st.money -= Number(b.dataset.cc)
        addLog('sys', `買了<b>${b.dataset.name}</b>，<b>−${moneyText(Number(b.dataset.cc))}</b>。`)
        renderStatus(); return refreshTop()
      case 'travel': return openSheet('travel')
      case 'go': closeSheet(); return startTravel(ROUTES[st.area][Number(b.dataset.i)])
      case 'toplain': closeSheet(); return goArea('plain', [1, 3])
      case 'ev': {
        closePage()
        st.road.done[st.road.day] = true
        const r = b.dataset.r
        if (r === 'leave') { addLog('sys', '你們沒有停下來，繼續趕路。'); return renderAll() }
        const natural = 1 + Math.floor(Math.random() * 20)
        const ok = natural + 2 >= 12
        addLog('sys', `翻覆的商隊：<b class="${ok ? 'ok' : 'bad'}">${ok ? '成功' : '失敗'}</b><span class="roll">${natural}＋2 = ${natural + 2} 對 DC 12</span>${ok && r === 'help' ? '　車夫塞給你們 <b>+30銅</b>。' : ''}`)
        if (ok && r === 'help') st.money += 30
        addLog('story', r === 'help'
          ? (ok ? '你們合力把貨車推回路面，車輪壓過碎石咯咯作響。車夫一瘸一拐地道謝，硬是把一小袋銅幣塞進你手裡。' : '貨車比想像中沉，推到一半又滑回溝裡。車夫嘆了口氣，說等下一支商隊經過再說吧。')
          : (ok ? '你撥開灌木，看見兩隻野狼正盯著散落的乾肉。牠們察覺到你，低吼兩聲，夾著尾巴鑽回樹林深處。' : '樹林裡的影子一晃就不見了。你什麼也沒看清，只覺得背後一陣涼。'), '旅途・翻覆的商隊')
        return setReading(true)
      }
      case 'notes': return openSheet('notes')
      case 'menu': {
        const l = b.dataset.label
        if (['快存', '快讀', '語言', '首頁'].includes(l)) return toast(`樣稿：「${l}」是直接執行的動作，不開頁面。`)
        return openPage('menu', { label: l })
      }
      case 'sell': return toast('樣稿：這裡會賣掉這件物品。')
      default: return toast(`樣稿：這裡會打開「${b.textContent.trim()}」`)
    }
  }

  // ── 提示與地名卡
  function toast(text) {
    app.querySelectorAll('.toast').forEach((el) => el.remove())
    const el = document.createElement('div')
    el.className = 'toast'
    el.textContent = text
    app.appendChild(el)
    setTimeout(() => el.remove(), 2400)
  }
  function placeCard(name, sub) {
    const el = document.createElement('div')
    el.className = 'placecard'
    el.innerHTML = `<b>${name}</b><small>${sub}</small>`
    app.appendChild(el)
    setTimeout(() => el.remove(), 1900)
  }

  function renderAll() {
    renderStatus(); renderMap(); renderComposer(); renderCtx(); renderTabs()
  }

  // ── 開場：幾行範例日誌
  addLog('sys', '讀取存檔「第 3 天・河谷鎮」。')
  addLog('story', '午後的河谷鎮很安靜，只有鐵匠鋪那邊傳來一下一下的敲打聲。廣場的告示板上，公會新貼的委託在風裡翻動。', '河谷鎮')
  addLog('sys', '這是樣稿 v2：點主角旁邊的格子移動。試試底部的主動行動、走到西邊的「城門」啟程旅行。')
  renderAll()
})()
</script>
